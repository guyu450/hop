<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hop Web Server - 登录</title>
    <link rel="stylesheet" href="/static/css/login.css">
    <link rel="icon" type="image/svg+xml" href="/static/images/favicon.svg">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="login-header">
                <h1>Apache Hop</h1>
                <p class="subtitle">Web Server 登录</p>
            </div>

            <div id="error-message" class="error-message" style="display: none;"></div>

            <form id="login-form" class="login-form" method="post" action="/login/authenticate">
                <div class="form-group">
                    <label for="username">用户名</label>
                    <input type="text" id="username" name="username" autocomplete="username" required>
                </div>

                <div class="form-group">
                    <label for="password">密码</label>
                    <input type="password" id="password" name="password" autocomplete="current-password" required>
                </div>

                <div class="form-group checkbox-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="rememberMe" name="rememberMe" value="true">
                        <span>记住我（30天）</span>
                    </label>
                </div>

                <button type="submit" class="login-button">登录</button>
            </form>

            <div class="login-footer">
                <p>Apache Hop Data Orchestration Platform</p>
            </div>
        </div>
    </div>

    <script>
        // Cookie 操作函数
        function setCookie(name, value, days) {
            let expires = '';
            if (days) {
                const date = new Date();
                date.setTime(date.getTime() + (days * 24 * 60 * 60 * 1000));
                expires = '; expires=' + date.toUTCString();
            }
            document.cookie = name + '=' + encodeURIComponent(value) + expires + '; path=/';
        }

        function getCookie(name) {
            const nameEQ = name + '=';
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                let cookie = cookies[i].trim();
                if (cookie.indexOf(nameEQ) === 0) {
                    return decodeURIComponent(cookie.substring(nameEQ.length));
                }
            }
            return null;
        }

        function deleteCookie(name) {
            document.cookie = name + '=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;';
        }

        // 显示错误消息
        function showError(message) {
            const errorDiv = document.getElementById('error-message');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
        }

        // 检查URL参数中是否有错误信息
        window.addEventListener('DOMContentLoaded', function() {
            const urlParams = new URLSearchParams(window.location.search);
            const error = urlParams.get('error');
            if (error) {
                const errorMessages = {
                    'invalid': '用户名或密码错误',
                    'timeout': '会话已过期，请重新登录',
                    'logout': '您已成功登出'
                };
                showError(errorMessages[error] || error);
            }

            // 检查记住我 Cookie
            const rememberedUsername = getCookie('hop_remember_me');
            if (rememberedUsername) {
                document.getElementById('username').value = rememberedUsername;
                document.getElementById('rememberMe').checked = true;
                document.getElementById('password').focus();
            } else {
                document.getElementById('username').focus();
            }
        });

        // 表单提交处理
        document.getElementById('login-form').addEventListener('submit', function(e) {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const rememberMe = document.getElementById('rememberMe').checked;

            if (!username) {
                e.preventDefault();
                showError('请输入用户名');
                return;
            }

            if (!password) {
                e.preventDefault();
                showError('请输入密码');
                return;
            }

            // 如果没有选择记住我，清除已有的 Cookie
            if (!rememberMe) {
                deleteCookie('hop_remember_me');
            }

            // 禁用提交按钮防止重复提交
            const submitBtn = this.querySelector('button[type="submit"]');
            submitBtn.disabled = true;
            submitBtn.textContent = '登录中...';
        });
    </script>
</body>
</html>
